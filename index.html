<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">

    <section class="mountain-side" aria-hidden="true"></section>

    <section class="auth-panel">
      <!-- SIGN UP -->
      <div class="screen" id="signup-screen">
        <h1>Sign Up</h1>

        <form id="signup-form">
          <input id="signup-username" type="text" placeholder="Username :" autocomplete="username" required>
          <input id="signup-password" type="password" placeholder="Password :" autocomplete="new-password" required>

          <button class="primary-button" type="submit">Continue</button>

          <button class="google-button" type="button" id="signup-google">
            <span>Or continue with Google</span>
            <span class="google-icon">G</span>
          </button>

          <p class="switch-text">Have an account?</p>
          <button class="secondary-link" type="button" id="show-login">Log in</button>
        </form>
      </div>

      <!-- CONFIRM SIGN UP -->
      <div class="screen hidden" id="confirm-screen">
        <h1>Sign Up</h1>

        <form id="confirm-form">
          <input id="confirm-password" type="password" placeholder="Confirm password :" autocomplete="new-password" required>
          <button class="primary-button" type="submit">Confirm</button>
        </form>
      </div>

      <!-- LOGIN -->
      <div class="screen hidden" id="login-screen">
        <h1>Log In</h1>

        <form id="login-form">
          <input id="login-username" type="text" placeholder="Username :" autocomplete="username" required>
          <input id="login-password" type="password" placeholder="Password :" autocomplete="current-password" required>

          <button class="primary-button" type="submit">Continue</button>

          <button class="google-button" type="button" id="login-google">
            <span>Or continue with Google</span>
            <span class="google-icon">G</span>
          </button>

          <p class="switch-text">Don't have an account?</p>
          <button class="secondary-link" type="button" id="show-signup">Sign up</button>
        </form>
      </div>

      <!-- SUCCESS -->
      <div class="screen hidden" id="success-screen">
        <h1>Welcome to Atlas</h1>
        <p class="success-text">You're signed in.</p>
        <button class="primary-button" id="logout-button">Log out</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
