<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Choose Your Role</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5faf7;
      color: #17251d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .logo {
      color: #238b57;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 45px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 52px);
      margin: 0 0 12px;
    }

    .subtitle {
      color: #66766d;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .choices {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .card {
      flex: 1;
      max-width: 350px;
      padding: 35px 25px;
      background: white;
      border: 2px solid #e1ebe5;
      border-radius: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      border-color: #238b57;
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(35, 139, 87, 0.12);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .card p {
      margin: 0;
      color: #718078;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .choices {
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Atlas</div>

    <h1>How will you use Atlas?</h1>

    <p class="subtitle">
      Choose your role to get started.
    </p>

    <div class="choices">

      <div class="card" onclick="chooseRole('student')">
        <div class="icon">🎓</div>
        <h2>Student</h2>
        <p>
          Study, organize homework, create flashcards,
          and learn with AI.
        </p>
      </div>

      <div class="card" onclick="chooseRole('educator')">
        <div class="icon">👩‍🏫</div>
        <h2>Educator</h2>
        <p>
          Organize classes, share resources,
          and help students learn.
        </p>
      </div>

    </div>

  </div>

  <script>
    function chooseRole(role) {
      localStorage.setItem("atlasRole", role);

      if (role === "student") {
        window.location.href = "student.html";
      } else {
        window.location.href = "educator.html";
      }
    }
  </script>

</body>
</html>
